<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"><title>PMG库 · 内嵌官网采集</title><style>body{margin:0;font:14px/1.6 Arial,'Microsoft YaHei',sans-serif;color:#222;background:#f5f5f5}aside{width:268px;padding:22px;box-sizing:border-box}img{width:140px}h1{font:24px Georgia,SimSun,serif;color:#053d22}label{display:block;margin:18px 0;color:#666;font-size:12px}input,select{width:100%;box-sizing:border-box;padding:10px;font:15px Arial;border:1px solid #ccc;border-radius:4px}button{padding:11px;border:0;border-radius:4px;background:#053d22;color:white;width:100%;font-size:14px;cursor:pointer}#retry{margin-top:10px;background:#d0d0cd;color:#222}#status{background:#fff;border:1px solid #ccc;padding:12px;margin:20px 0;white-space:pre-line;overflow-wrap:anywhere}small{color:#666}#phase{font-weight:bold;color:#053d22}</style></head><body><aside><img src="../assets/pmg-logo.svg" alt="PMG"><h1>内嵌官网采集</h1><form id="form"><label>查询网站<select id="site"><option value="cn">中国网站</option><option value="global">全球网站</option></select></label><label>评级号码<input id="cert" required placeholder="8077301-001"></label><label>评分<input id="grade" type="number" min="1" max="70" value="67" required></label><button>载入官网并自动保存</button></form><button id="retry">重新检查当前页面</button><div id="status"><div id="phase">等待查询</div><div id="message">官网将在右侧浏览区域中显示。</div></div><small>遇到官网验证时，请在右侧完成。详情稳定后自动保存一次；再次采集请重新查询。保存结果会自动加入本地藏品库。</small></aside><script src="collector.js"></script></body></html>
