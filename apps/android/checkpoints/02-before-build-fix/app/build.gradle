plugins { id 'com.android.application' }
def signing = new Properties()
def signingFile = rootProject.file('private/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'io.github.yushendu224.pmglibrary.preview'
    compileSdk 35
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'io.github.yushendu224.pmglibrary.preview'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview.1'
    }
    signingConfigs {
        preview {
            if (signingFile.exists()) {
                storeFile rootProject.file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.preview
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
